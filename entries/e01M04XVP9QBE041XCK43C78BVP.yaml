title: Decision-dense sessions happen on uncovered surfaces; manual notes read as homework
body: >-
  clew was designed in phone/cloud chats no watcher covers. When an agent bridged that
  sensor gap by prescribing manual notes, the owner read the product as homework — an
  I1-violation smell, correctly detected. Non-discipline mitigations: one export+backfill
  per important conversation; decisions echo into covered working sessions and are caught
  on first echo. The §11 cloud-sensor trigger effectively fires now for phone-heavy owners.
