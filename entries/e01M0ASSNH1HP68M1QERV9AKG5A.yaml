title: Attachments bypass the secret scrub; GitHub push protection caught PATs
body: >-
  GitHub push protection blocked the journal push: two ephemeral PATs the owner pasted
  in chat were present verbatim in the attached raw transcript. The entries pipeline
  scrubs quotes/bodies (6.2) but attachments bypass the scrub entirely. Fix: run the
  same secret-scrub over transcripts/ (and any attachment) before commit; treat platform
  push-protection as backstop, never primary.
quote: 'GITHUB PUSH PROTECTION - Push cannot contain secrets'
